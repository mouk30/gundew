<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="goldLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="16" />
  
  <!-- Subtle Inner Ring -->
  <rect x="42" y="42" width="428" height="428" rx="88" fill="none" stroke="#fbbf24" stroke-opacity="0.2" stroke-width="2" />

  <!-- Crown / Royal Crest Accent -->
  <g fill="url(#crownGrad)" transform="translate(256, 120) scale(1.15)">
    <!-- Center peak -->
    <polygon points="0,-32 12,-4 0,4 -12,-4" />
    <!-- Left peak -->
    <polygon points="-38,-20 -20,-2 -26,8 -42,4" />
    <!-- Right peak -->
    <polygon points="38,-20 42,4 26,8 20,-2" />
    <!-- Crown base arc -->
    <circle cx="0" cy="-36" r="4" fill="#ffffff" />
    <circle cx="-38" cy="-24" r="3.5" fill="#ffffff" />
    <circle cx="38" cy="-24" r="3.5" fill="#ffffff" />
    <path d="M-40,12 Q0,18 40,12 L38,18 Q0,24 -38,18 Z" />
  </g>

  <!-- Iconic 'W' Glyph with Serif Architecture -->
  <g filter="url(#goldGlow)">
    <path d="M 96,180
             L 156,180
             L 142,204
             L 182,340
             L 228,212
             L 204,212
             L 204,180
             L 268,180
             L 268,212
             L 246,212
             L 288,340
             L 332,198
             L 316,180
             L 374,180
             L 374,212
             L 354,212
             L 290,388
             L 242,388
             L 204,272
             L 168,388
             L 120,388
             L 76,212
             L 54,212
             Z"
          fill="url(#goldLetter)" />
  </g>

  <!-- Subtle Star Sparkle at Top Right of W -->
  <g transform="translate(372, 172) scale(0.9)" fill="#ffffff">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" opacity="0.95" />
    <circle cx="0" cy="0" r="3" fill="#fef08a" />
  </g>
</svg>
